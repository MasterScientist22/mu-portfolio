<!DOCTYPE HTML>
<!--
	Lens by HTML5 UP — Modified for Portfolio use
-->
<html>
	<head>
		<title>Tshering Kelxang — Portfolio</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<style>
			/* ── Profile Panel ── */
			#profile-panel {
				padding: 2.5em 2.25em 1.5em;
				text-align: center;
				cursor: default;
			}

			#profile-photo-wrap {
				display: inline-block;
				margin-bottom: 1.25em;
				cursor: pointer;
				position: relative;
			}

			#profile-photo-wrap img {
				width: 120px;
				height: 120px;
				border-radius: 50%;
				object-fit: cover;
				border: 3px solid #00D3B7;
				display: block;
				transition: box-shadow 0.25s ease, transform 0.25s ease;
			}

			#profile-photo-wrap:hover img {
				box-shadow: 0 0 0 5px rgba(0,211,183,0.3);
				transform: scale(1.04);
			}

			#profile-photo-wrap .click-hint {
				position: absolute;
				bottom: -1.4em;
				left: 50%;
				transform: translateX(-50%);
				font-size: 0.65em;
				color: #00D3B7;
				white-space: nowrap;
				letter-spacing: 0.05em;
				opacity: 0.8;
			}

			#profile-name {
				font-size: 1.5em;
				font-weight: 700;
				color: #555;
				margin: 1.6em 0 0.3em;
				line-height: 1.2;
			}

			#profile-bio {
				font-size: 0.85em;
				color: #aaa;
				line-height: 1.6;
				margin: 0;
			}

			/* ── Works Panel ── */
			#works-panel {
				display: none;
				flex-direction: column;
				height: 100%;
			}

			#works-header {
				display: flex;
				align-items: center;
				gap: 0.75em;
				padding: 1.5em 2.25em 1em;
				border-bottom: 1px solid #eee;
				flex-shrink: 0;
			}

			#works-back-btn {
				background: none;
				border: none;
				color: #00D3B7;
				cursor: pointer;
				font-size: 1em;
				padding: 0;
				display: flex;
				align-items: center;
				gap: 0.4em;
				transition: opacity 0.2s;
			}

			#works-back-btn:hover { opacity: 0.7; }

			#works-header h2 {
				font-size: 1em;
				font-weight: 700;
				color: #555;
				margin: 0;
			}

			#works-list {
				overflow-y: auto;
				flex: 1;
				padding: 0.75em 0;
			}

			.work-item {
				display: flex;
				align-items: center;
				gap: 0.85em;
				padding: 0.65em 2.25em;
				cursor: pointer;
				transition: background 0.2s ease;
				text-align: left;
				border: none;
				background: none;
				width: 100%;
			}

			.work-item:hover { background: rgba(0,211,183,0.07); }
			.work-item.active { background: rgba(0,211,183,0.13); }

			.work-item .work-thumb {
				width: 52px;
				height: 52px;
				border-radius: 6px;
				object-fit: cover;
				flex-shrink: 0;
				border: 2px solid transparent;
				transition: border-color 0.2s;
			}

			.work-item.active .work-thumb,
			.work-item:hover .work-thumb {
				border-color: #00D3B7;
			}

			.work-item .work-meta { flex: 1; overflow: hidden; }

			.work-item .work-title {
				font-size: 0.9em;
				font-weight: 700;
				color: #555;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				margin-bottom: 0.2em;
			}

			.work-item .work-tag {
				font-size: 0.72em;
				color: #00D3B7;
				text-transform: uppercase;
				letter-spacing: 0.06em;
			}

			/* ── Work Detail (replaces profile when a work is active) ── */
			#work-detail-panel {
				display: none;
				padding: 1.75em 2.25em;
				text-align: left;
			}

			#work-detail-panel.visible { display: block; }

			#detail-back-btn {
				background: none;
				border: none;
				color: #00D3B7;
				cursor: pointer;
				font-size: 0.85em;
				padding: 0 0 1em;
				display: flex;
				align-items: center;
				gap: 0.4em;
				transition: opacity 0.2s;
			}

			#detail-back-btn:hover { opacity: 0.7; }

			#detail-title {
				font-size: 1.3em;
				font-weight: 700;
				color: #555;
				margin-bottom: 0.4em;
			}

			#detail-tag {
				font-size: 0.75em;
				color: #00D3B7;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				margin-bottom: 1em;
			}

			#detail-description {
				font-size: 0.875em;
				color: #888;
				line-height: 1.7;
				margin-bottom: 1.25em;
			}

			#detail-year {
				font-size: 0.78em;
				color: #bbb;
			}

			/* ── Section Headers in Works List ── */
			.works-section-header {
				padding: 0.9em 2.25em 0.4em;
				font-size: 0.7em;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.1em;
				color: #00D3B7;
				border-top: 1px solid #eee;
				margin-top: 0.4em;
				cursor: default;
				user-select: none;
			}

			.works-section-header:first-child {
				border-top: none;
				margin-top: 0;
			}

			/* ── Footer ── */
			#footer {
				padding: 1.5em 2.25em 1em;
				border-top: 1px solid #eee;
			}

			/* ── Viewer caption override ── */
			#viewer .slide .caption {
				padding-bottom: 1.5em;
				background-image: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.4) 60%, transparent);
			}

			#viewer .slide .caption h2 {
				font-size: 1.2em;
				margin-bottom: 0.4em;
				color: #fff;
				text-shadow: 0 1px 4px rgba(0,0,0,0.6);
			}

			#viewer .slide .caption p {
				font-size: 0.88em;
				margin: 0 0 0.4em;
				color: rgba(255,255,255,0.85);
				text-shadow: 0 1px 3px rgba(0,0,0,0.5);
				line-height: 1.6;
			}

			#viewer .slide .caption .caption-desc {
				display: block;
				font-size: 0.82em;
				color: rgba(255,255,255,0.7);
				margin-top: 0.35em;
				text-shadow: 0 1px 3px rgba(0,0,0,0.5);
				line-height: 1.6;
			}
		</style>
	</head>
	<body class="is-preload-0 is-preload-1 is-preload-2">

		<!-- Main -->
		<div id="main">

			<!-- Profile Panel (default view) -->
			<div id="profile-panel">
				<a href="admin.html" title="Admin" style="
					position:absolute;
					top:0.75em;
					right:0.75em;
					color:rgba(0,0,0,0.2);
					border:none;
					font-size:1.1em;
					text-decoration:none;
					transition:color 0.2s;
				" onmouseover="this.style.color='#00D3B7'" onmouseout="this.style.color='rgba(0,0,0,0.2)'">&#9881;</a>
				<div id="profile-photo-wrap" title="Click to view my works">
					<!-- Replace images/profile.jpg with your actual photo -->
					<img src="images/profile.jpg" alt="My Photo" id="profile-photo" onerror="this.src='images/thumbs/01.jpg'" />
					<span class="click-hint">▸ View my works</span>
				</div>
				<h1 id="profile-name">Tshering Kelxang</h1>
				<p id="profile-bio">Gamer. Videographer. Animation Rigger. Photographer. Graphic Designer. Crafting worlds through lenses, rigs, and pixels — one frame at a time.</p>
			</div>

			<!-- Works Panel (shown after clicking profile photo) -->
			<div id="works-panel">
				<div id="works-header">
					<button id="works-back-btn" title="Back to profile">&#8592; Back</button>
					<h2>My Works</h2>
				</div>
				<div id="works-list">
					<!-- Populated by JS from the works data -->
				</div>
			</div>

			<!-- Work Detail Panel (shown in sidebar when a work is selected) -->
			<div id="work-detail-panel">
				<button id="detail-back-btn" title="Back to works list">&#8592; All Works</button>
				<div id="detail-tag"></div>
				<h2 id="detail-title"></h2>
				<p id="detail-description"></p>
				<p id="detail-year"></p>
			</div>

			<!-- Footer -->
			<footer id="footer">
				<ul class="copyright">
					<li>&copy; Tshering Kelxang.</li>
					<li><a href="admin.html" style="font-size:0.7em;opacity:0.35;border-bottom:none;color:inherit;" title="Admin">⚙</a></li>
				</ul>
			</footer>

		</div><!-- /main -->

		<!-- Hidden thumbnails section (still needed by main.js viewer engine) -->
		<section id="thumbnails" style="display:none;"></section>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/portfolio.js"></script>

	</body>
</html>
